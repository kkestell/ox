[package]
name = "ox"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ox-github = { path = "../ox-github" }
ox-protocol = { path = "../ox-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-wdio-webdriver = { version = "1.5.1", optional = true }
tokio = { version = "1", features = ["sync"] }

[features]
# An embedded WebDriver server, which the end-to-end tests in `ui/e2e` drive
# the app through.
webdriver = ["dep:tauri-plugin-wdio-webdriver"]


[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }
