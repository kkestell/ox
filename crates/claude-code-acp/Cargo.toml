[package]
name = "claude-code-acp"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "ACP bridge for the Claude Code CLI"

[dependencies]
agent-client-protocol = { version = "=5.2.0", features = ["stdio"] }
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
dirs = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
