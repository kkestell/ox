[package]
name = "ox-protocol"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Wire types and client for the oxd session daemon"

[dependencies]
agent-client-protocol = { version = "=5.2.0", features = ["unstable_protocol_v2"] }
dirs = "7"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "sync", "rt", "process", "time"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros"] }

[lints]
workspace = true
