[package]
name = "oxctl"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Command-line client for oxd"

[dependencies]
clap = { version = "4", features = ["derive"] }
ox-protocol = { path = "../ox-protocol" }
serde = "1"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
