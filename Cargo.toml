[package]
name = "ox"
version = "0.1.0"
edition = "2024"

[dependencies]
agent-client-protocol = "2.1.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
futures = "0.3.31"
keyring = "4.2.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rpassword = "7.5.4"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustix = { version = "1.1.5", features = ["process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "time", "signal"] }
uuid = { version = "1.26.1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["io-util", "net"] }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = "symbols"

[profile.fast]
inherits = "release"
codegen-units = 16
lto = false
strip = "none"
incremental = true
