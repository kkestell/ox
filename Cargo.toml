[workspace]
members = ["crates/ox", "crates/ox-server"]
resolver = "3"

[workspace.dependencies]
agent-client-protocol = { version = "2.1.0", features = ["unstable_tool_call_name"] }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures = "0.3.34"
ratatui = "0.30"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
similar = "2.7"
tempfile = "3.27.0"
tui-markdown = { version = "0.3", default-features = false }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
unicode-width = "0.2"
ox-server = { path = "crates/ox-server" }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = "symbols"

[profile.fast]
inherits = "release"
codegen-units = 16
lto = false
strip = "none"
incremental = false

[profile.dev]
debug = "line-tables-only"
incremental = false
split-debuginfo = "packed"
