<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ox</title>
  <style>
    body { display: flex; gap: 1em; margin: 0; font-family: sans-serif; }
    nav { width: 22em; padding: 0.5em; border-right: 1px solid #ccc; min-height: 100vh; }
    main { flex: 1; padding: 0.5em; }
    nav ul { list-style: none; padding-left: 0.5em; }
    nav li { cursor: pointer; font-family: monospace; }
    nav li.selected { font-weight: bold; }
    pre { white-space: pre-wrap; }
  </style>
</head>
<body>
  <nav>
    <form id="create">
      <input name="workspace" value="{{.Workspace}}" placeholder="Workspace" size="30" required>
      <input name="model" value="haiku" placeholder="Model" size="8">
      <button>New session</button>
    </form>
    <div id="workspaces"></div>
  </nav>
  <main>
    <p id="title"></p>
    <pre id="output"></pre>
    <div id="approvals"></div>
    <form id="send">
      <textarea name="text" rows="3" cols="60" placeholder="Prompt" required></textarea>
      <button>Send</button>
    </form>
    <p id="error"></p>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    let connection;
    let nextId = 1;
    const pending = new Map();
    // The page receives every session's updates; selected is the one shown.
    const workspaces = new Map(); // workspace_id -> path
    const sessions = new Map(); // session_id -> { workspaceId, state, output, approvals }
    let selected;

    const events = new EventSource("/events");
    events.addEventListener("connection", (e) => {
      connection = e.data;
      load().catch(showError);
    });
    events.onmessage = (e) => {
      const message = JSON.parse(e.data);
      const params = message.params;
      switch (message.method) {
        case "session/update": {
          // Updates for a session not loaded yet are in the history it loads with.
          const session = sessions.get(params.session_id);
          if (session) {
            apply(session, params);
            render();
          }
          return;
        }
        case "workspace/created":
          workspaces.set(params.workspace_id, params.path);
          render();
          return;
        case "session/created":
          get(params.session_id, params.workspace_id).then(render, showError);
          return;
        case "session/destroyed":
          sessions.delete(params.session_id);
          if (selected === params.session_id) selected = undefined;
          render();
          return;
      }
      const call = pending.get(message.id);
      if (!call) return;
      pending.delete(message.id);
      if (message.error) call.reject(new Error(message.error.message));
      else call.resolve(message.result);
    };

    function rpc(method, params) {
      const id = nextId++;
      return new Promise((resolve, reject) => {
        pending.set(id, { resolve, reject });
        const fail = (error) => { pending.delete(id); reject(error); };
        fetch(`/rpc?connection=${connection}`, {
          method: "POST",
          body: JSON.stringify({ jsonrpc: "2.0", id, method, params }),
        }).then(
          (response) => { if (!response.ok) response.text().then((text) => fail(new Error(text))); },
          fail,
        );
      });
    }

    function showError(error) {
      $("error").textContent = error ? String(error.message ?? error) : "";
    }

    async function load() {
      const { workspaces: list } = await rpc("workspace/list", {});
      for (const w of list) {
        workspaces.set(w.workspace_id, w.path);
        for (const s of w.sessions) await get(s.session_id, w.workspace_id);
      }
      render();
    }

    // get loads a session. Its live updates apply from the response onward.
    async function get(id, workspaceId) {
      const result = await rpc("session/get", { session_id: id });
      const session = { workspaceId, state: result.state, output: "", approvals: new Map() };
      for (const u of result.history) apply(session, u);
      for (const a of result.prompt?.approvals ?? []) session.approvals.set(a.request_id, a.request);
      sessions.set(id, session);
    }

    // apply adds one update, live or from history, to a session.
    function apply(session, u) {
      switch (u.type) {
        case "prompt":
          session.output += `> ${u.text}\n\n`;
          break;
        case "text_delta":
          session.output += u.text;
          break;
        case "result":
          session.output += u.result.is_error ? `\n[error] ${u.result.text}\n\n` : "\n\n";
          break;
        case "state":
          session.state = u.state;
          break;
        case "parked":
          session.state = "parked";
          break;
        case "approval":
          session.approvals.set(u.request_id, u.request);
          break;
        case "approval_answered":
        case "approval_cancelled":
          session.approvals.delete(u.request_id);
          break;
        case "exited":
          session.output += `\n[exited] ${u.error}\n\n`;
          break;
      }
    }

    function render() {
      const nav = $("workspaces");
      nav.replaceChildren();
      for (const [workspaceId, path] of workspaces) {
        const heading = document.createElement("p");
        heading.textContent = path;
        const list = document.createElement("ul");
        for (const [id, session] of sessions) {
          if (session.workspaceId !== workspaceId) continue;
          const item = document.createElement("li");
          item.textContent = `${id.slice(0, 8)} ${session.state}${session.approvals.size ? " (approval)" : ""}`;
          item.className = id === selected ? "selected" : "";
          item.onclick = () => { selected = id; showError(); render(); };
          list.append(item);
        }
        nav.append(heading, list);
      }

      const session = sessions.get(selected);
      $("title").textContent = session ? `${workspaces.get(session.workspaceId)} · ${selected} · ${session.state}` : "";
      $("output").textContent = session?.output ?? "";
      $("approvals").replaceChildren();
      for (const [requestId, request] of session?.approvals ?? []) addApproval(selected, requestId, request);
    }

    function addApproval(sessionId, requestId, request) {
      const box = document.createElement("fieldset");
      const legend = document.createElement("legend");
      legend.textContent = request.tool_name;
      const input = document.createElement("pre");
      input.textContent = JSON.stringify(request.input, null, 2);
      const answer = (response) => {
        showError();
        rpc("session/approve", { session_id: sessionId, request_id: requestId, response }).catch(showError);
      };
      const allow = document.createElement("button");
      allow.textContent = "Allow";
      allow.onclick = () => answer({ behavior: "allow", updatedInput: request.input });
      const deny = document.createElement("button");
      deny.textContent = "Deny";
      deny.onclick = () => answer({ behavior: "deny", message: "Denied by user" });
      box.append(legend, input, allow, deny);
      $("approvals").append(box);
    }

    $("create").onsubmit = async (e) => {
      e.preventDefault();
      showError();
      const form = new FormData(e.target);
      try {
        // The created events add the workspace and session to the sidebar.
        const { workspace_id } = await rpc("workspace/create", { path: form.get("workspace") });
        const { session_id } = await rpc("session/create", { workspace_id, model: form.get("model") });
        selected = session_id;
        render();
      } catch (error) {
        showError(error);
      }
    };

    $("send").onsubmit = (e) => {
      e.preventDefault();
      showError();
      if (!selected) return showError("Select a session");
      const text = new FormData(e.target).get("text");
      rpc("session/send", { session_id: selected, text }).then(() => e.target.reset(), showError);
    };
  </script>
</body>
</html>
