<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ox</title>
  <style>
    body { display: flex; gap: 1em; margin: 0; font-family: sans-serif; }
    nav { width: 22em; padding: 0.5em; border-right: 1px solid #ccc; min-height: 100vh; }
    main { flex: 1; padding: 0.5em; }
    nav ul { list-style: none; padding-left: 0.5em; }
    nav li { cursor: pointer; font-family: monospace; }
    nav li.selected { font-weight: bold; }
    pre { white-space: pre-wrap; }
    #output pre { margin: 0; }
    #output details { margin: 0.25em 0; font-family: monospace; }
    #output details pre { margin: 0.25em 0 0.25em 1.5em; padding: 0.25em; background: #f4f4f4; }
    #output details.error summary { color: #b00; }
  </style>
</head>
<body>
  <nav>
    <form id="create">
      <input name="workspace" value="{{.Workspace}}" placeholder="Workspace" size="30" required>
      <select name="model"></select>
      <select name="effort"></select>
      <select name="permission_mode"></select>
      <button>New session</button>
    </form>
    <div id="workspaces"></div>
  </nav>
  <main>
    <p><span id="title"></span> <button id="delete" hidden>Delete</button></p>
    <div id="output"></div>
    <div id="approvals"></div>
    <form id="send">
      <textarea name="text" rows="3" cols="60" placeholder="Prompt" required></textarea>
      <button>Send</button>
    </form>
    <form id="settings">
      <select name="model"></select>
      <select name="effort"></select>
      <select name="permission_mode"></select>
    </form>
    <p id="error"></p>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    let connection;
    let nextId = 1;
    const pending = new Map();
    // The page receives every session's updates; selected is the one shown.
    const workspaces = new Map(); // workspace_id -> path
    const sessions = new Map(); // session_id -> { workspaceId, state, settings, configuring, entries, tools, approvals }
    let selected;

    // Both forms choose model, effort, and permission mode.
    const models = ["haiku", "sonnet", "opus", "fable"];
    const efforts = ["low", "medium", "high", "xhigh", "max", "ultracode"];
    const modes = ["manual", "acceptEdits", "auto", "bypassPermissions", "dontAsk", "plan"];
    for (const form of [$("create"), $("settings")]) {
      for (const m of models) form.elements.model.add(new Option(m, m));
      for (const e of efforts) form.elements.effort.add(new Option(e, e));
      for (const m of modes) form.elements.permission_mode.add(new Option(m, m));
    }
    $("create").elements.effort.value = "medium";
    const settingsOf = (p) => ({ model: p.model, effort: p.effort, permission_mode: p.permission_mode });

    const events = new EventSource("/events");
    events.addEventListener("connection", (e) => {
      connection = e.data;
      load().catch(showError);
    });
    events.onmessage = (e) => {
      const message = JSON.parse(e.data);
      const params = message.params;
      switch (message.method) {
        case "session/update": {
          // Updates for a session not loaded yet are in the history it loads with.
          const session = sessions.get(params.session_id);
          if (session) {
            apply(session, params);
            render();
          }
          return;
        }
        case "workspace/created":
          workspaces.set(params.workspace_id, params.path);
          render();
          return;
        case "session/created":
          get(params.session_id, params.workspace_id, settingsOf(params)).then(render, showError);
          return;
        case "session/configured": {
          const session = sessions.get(params.session_id);
          if (session) {
            session.settings = settingsOf(params);
            render();
          }
          return;
        }
        case "session/destroyed":
          sessions.delete(params.session_id);
          if (selected === params.session_id) selected = undefined;
          render();
          return;
      }
      const call = pending.get(message.id);
      if (!call) return;
      pending.delete(message.id);
      if (message.error) call.reject(new Error(message.error.message));
      else call.resolve(message.result);
    };

    function rpc(method, params) {
      const id = nextId++;
      return new Promise((resolve, reject) => {
        pending.set(id, { resolve, reject });
        const fail = (error) => { pending.delete(id); reject(error); };
        fetch(`/rpc?connection=${connection}`, {
          method: "POST",
          body: JSON.stringify({ jsonrpc: "2.0", id, method, params }),
        }).then(
          (response) => { if (!response.ok) response.text().then((text) => fail(new Error(text))); },
          fail,
        );
      });
    }

    function showError(error) {
      $("error").textContent = error ? String(error.message ?? error) : "";
    }

    async function load() {
      const { workspaces: list } = await rpc("workspace/list", {});
      for (const w of list) {
        workspaces.set(w.workspace_id, w.path);
        for (const s of w.sessions) await get(s.session_id, w.workspace_id, settingsOf(s));
      }
      render();
    }

    // get loads a session. Its live updates apply from the response onward.
    async function get(id, workspaceId, settings) {
      const result = await rpc("session/get", { session_id: id });
      const session = {
        workspaceId, state: result.state, settings, configuring: false,
        entries: [], tools: new Map(), approvals: new Map(),
      };
      for (const u of result.history) apply(session, u);
      for (const a of result.prompt?.approvals ?? []) session.approvals.set(a.request_id, a.request);
      sessions.set(id, session);
    }

    // apply adds one update, live or from history, to a session. Its entries
    // are runs of text and tool calls, in order.
    function apply(session, u) {
      const write = (text) => {
        const last = session.entries.at(-1);
        if (last?.text !== undefined) last.text += text;
        else session.entries.push({ text });
      };
      switch (u.type) {
        case "prompt":
          write(`> ${u.text}\n\n`);
          break;
        case "text_delta":
          write(u.text);
          break;
        case "tool_use": {
          const tool = { name: u.tool_name, input: u.input, open: false };
          session.entries.push(tool);
          session.tools.set(u.tool_use_id, tool);
          break;
        }
        case "tool_result": {
          const tool = session.tools.get(u.tool_use_id);
          if (tool) tool.result = u.result;
          break;
        }
        case "result":
          write(u.result.is_error ? `\n[error] ${u.result.text}\n\n` : "\n\n");
          break;
        case "state":
          session.state = u.state;
          break;
        case "parked":
          session.state = "parked";
          break;
        case "approval":
          session.approvals.set(u.request_id, u.request);
          break;
        case "approval_answered":
        case "approval_cancelled":
          session.approvals.delete(u.request_id);
          break;
        case "exited":
          write(`\n[exited] ${u.error}\n\n`);
          break;
      }
    }

    function render() {
      const nav = $("workspaces");
      nav.replaceChildren();
      for (const [workspaceId, path] of workspaces) {
        const heading = document.createElement("p");
        heading.textContent = path;
        const list = document.createElement("ul");
        for (const [id, session] of sessions) {
          if (session.workspaceId !== workspaceId) continue;
          const item = document.createElement("li");
          item.textContent = `${id.slice(0, 8)} ${session.state}${session.approvals.size ? " (approval)" : ""}`;
          item.className = id === selected ? "selected" : "";
          item.onclick = () => { selected = id; showError(); render(); };
          list.append(item);
        }
        nav.append(heading, list);
      }

      const session = sessions.get(selected);
      $("title").textContent = session ? `${workspaces.get(session.workspaceId)} · ${selected} · ${session.state}` : "";
      $("delete").hidden = !session;
      $("output").replaceChildren(...(session?.entries ?? []).map(renderEntry));
      // Claude takes configuration only while idle; a parked session stores it.
      const configurable = session && !session.configuring && (session.state === "idle" || session.state === "parked");
      for (const field of ["model", "effort", "permission_mode"]) {
        const element = $("settings").elements[field];
        if (element !== document.activeElement) element.value = session?.settings[field] ?? "";
        element.disabled = !configurable;
      }
      $("approvals").replaceChildren();
      for (const [requestId, request] of session?.approvals ?? []) addApproval(selected, requestId, request);
    }

    // renderEntry shows text as is and a tool call as its name and first
    // input value, expanding to its full input and result.
    function renderEntry(entry) {
      if (entry.text !== undefined) {
        const text = document.createElement("pre");
        text.textContent = entry.text;
        return text;
      }
      const details = document.createElement("details");
      details.open = entry.open;
      details.ontoggle = () => { entry.open = details.open; };
      if (entry.result?.is_error) details.className = "error";
      const summary = document.createElement("summary");
      const first = Object.values(entry.input ?? {}).find((v) => typeof v === "string") ?? "";
      const status = entry.result ? (entry.result.is_error ? " (error)" : "") : " …";
      summary.textContent = `${entry.name} ${first.split("\n")[0].slice(0, 120)}${status}`;
      const input = document.createElement("pre");
      input.textContent = JSON.stringify(entry.input, null, 2);
      const result = document.createElement("pre");
      result.textContent = entry.result?.text ?? "";
      details.append(summary, input, result);
      return details;
    }

    function addApproval(sessionId, requestId, request) {
      const box = document.createElement("fieldset");
      const legend = document.createElement("legend");
      legend.textContent = request.tool_name;
      const input = document.createElement("pre");
      input.textContent = JSON.stringify(request.input, null, 2);
      const answer = (response) => {
        showError();
        rpc("session/approve", { session_id: sessionId, request_id: requestId, response }).catch(showError);
      };
      const allow = document.createElement("button");
      allow.textContent = "Allow";
      allow.onclick = () => answer({ behavior: "allow", updatedInput: request.input });
      const deny = document.createElement("button");
      deny.textContent = "Deny";
      deny.onclick = () => answer({ behavior: "deny", message: "Denied by user" });
      box.append(legend, input, allow, deny);
      $("approvals").append(box);
    }

    $("create").onsubmit = async (e) => {
      e.preventDefault();
      showError();
      const form = new FormData(e.target);
      try {
        // The created events add the workspace and session to the sidebar.
        const { workspace_id } = await rpc("workspace/create", { path: form.get("workspace") });
        const { session_id } = await rpc("session/create", {
          workspace_id, model: form.get("model"), effort: form.get("effort"), permission_mode: form.get("permission_mode"),
        });
        selected = session_id;
        render();
      } catch (error) {
        showError(error);
      }
    };

    // Changing any setting sends all three.
    $("settings").onchange = () => {
      const session = sessions.get(selected);
      const f = $("settings").elements;
      const settings = { model: f.model.value, effort: f.effort.value, permission_mode: f.permission_mode.value };
      showError();
      session.configuring = true;
      render();
      rpc("session/configure", { session_id: selected, ...settings })
        .then(() => { session.settings = settings; }, showError)
        .finally(() => { session.configuring = false; render(); });
    };

    // The destroyed event removes the session from every page.
    $("delete").onclick = () => {
      if (!confirm(`Delete session ${selected} and its history?`)) return;
      showError();
      rpc("session/destroy", { session_id: selected }).catch(showError);
    };

    $("send").onsubmit = (e) => {
      e.preventDefault();
      showError();
      if (!selected) return showError("Select a session");
      const text = new FormData(e.target).get("text");
      rpc("session/send", { session_id: selected, text }).then(() => e.target.reset(), showError);
    };
  </script>
</body>
</html>
