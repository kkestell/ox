name: Release

# A vMAJOR.MINOR.PATCH tag, optionally carrying a prerelease suffix such as
# v1.0.0-alpha1, publishes the archives and checksums that this workflow builds,
# verifies, and stages. A suffixed tag publishes as a GitHub prerelease. No
# other event publishes.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate the release tag
        id: version
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          core='(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)'
          prerelease='(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?'
          if ! printf '%s\n' "$tag" | grep -Eq "^v$core$prerelease\$"; then
            echo "::error::$tag is not a vMAJOR.MINOR.PATCH tag with an optional prerelease suffix" >&2
            exit 1
          fi
          printf 'value=%s\n' "${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install pinned check tools
        env:
          DPRINT_VERSION: 0.57.4
          STATICCHECK_VERSION: v0.8.1
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/tools"
          archive="dprint-x86_64-unknown-linux-gnu.zip"
          base="https://github.com/dprint/dprint/releases/download/$DPRINT_VERSION"
          mkdir -p "$tools"
          curl -fsSL -o "$RUNNER_TEMP/$archive" "$base/$archive"
          curl -fsSL -o "$RUNNER_TEMP/SHASUMS256.txt" "$base/SHASUMS256.txt"
          (cd "$RUNNER_TEMP" &&
            sha256sum --check --strict --ignore-missing SHASUMS256.txt)
          unzip -q -o "$RUNNER_TEMP/$archive" -d "$tools"
          chmod +x "$tools/dprint"
          go install "honnef.co/go/tools/cmd/staticcheck@$STATICCHECK_VERSION"
          printf '%s\n%s\n' "$tools" "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$tools/dprint" --version
          "$(go env GOPATH)/bin/staticcheck" -version

      # The browser client ships separately from these archives, so the
      # release gate is the part of `make check` that covers the executable
      # rather than a second toolchain in the release path.
      - name: Run the documentation, Go, and unit-test gate
        run: make check-docs check-go test

      - name: Build and package every target
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          mkdir -p dist
          install -m 0755 install.sh dist/install.sh
          # The linker addresses the executable's own package as main, not by
          # its import path.
          for target in darwin_arm64 darwin_amd64 linux_arm64 linux_amd64; do
            goos="${target%_*}"
            goarch="${target##*_}"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build \
              -trimpath \
              -ldflags "-s -w -X main.version=$VERSION" \
              -o dist/ox ./cmd/ox
            tar -C dist -czf "dist/ox_${VERSION}_${target}.tar.gz" ox install.sh
            rm dist/ox
          done
          rm dist/install.sh
          (cd dist && sha256sum ox_*.tar.gz > SHA256SUMS)

      - name: Verify the archives and checksums
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check --strict SHA256SUMS)
          for target in darwin_arm64 darwin_amd64 linux_arm64 linux_amd64; do
            archive="dist/ox_${VERSION}_${target}.tar.gz"
            directory="$(mktemp -d)"
            tar -xzf "$archive" -C "$directory"
            contents="$(ls -A "$directory" | sort | tr '\n' ' ')"
            if [ "$contents" != "install.sh ox " ] ||
              [ ! -x "$directory/ox" ] || [ ! -x "$directory/install.sh" ]; then
              echo "::error::$archive must hold executable ox and install.sh, found: $contents" >&2
              exit 1
            fi
            rm -rf "$directory"
          done

      - name: Run the released Linux binary and its installer
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          directory="$(mktemp -d)"
          tar -xzf "dist/ox_${VERSION}_linux_amd64.tar.gz" -C "$directory"
          "$directory/ox" --version > "$directory/stdout" 2> "$directory/stderr"
          if [ "$(cat "$directory/stdout")" != "ox $VERSION" ]; then
            echo "::error::artifact reported $(cat "$directory/stdout")" >&2
            exit 1
          fi
          if [ -s "$directory/stderr" ]; then
            echo "::error::artifact wrote to stderr: $(cat "$directory/stderr")" >&2
            exit 1
          fi
          home="$(mktemp -d)"
          env -u XDG_CONFIG_HOME HOME="$home" "$directory/install.sh"
          settings="$home/.config/ox/settings.json"
          if [ "$(env -u XDG_CONFIG_HOME HOME="$home" "$home/.local/bin/ox" --version)" \
            != "ox $VERSION" ]; then
            echo "::error::installed binary reported the wrong version" >&2
            exit 1
          fi
          python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$settings"
          # A second run upgrades the executable without touching settings the
          # user has edited.
          printf '{}\n' > "$settings"
          env -u XDG_CONFIG_HOME HOME="$home" "$directory/install.sh"
          if [ "$(cat "$settings")" != "{}" ]; then
            echo "::error::installer overwrote existing settings" >&2
            exit 1
          fi
          rm -rf "$directory" "$home"

      - name: Stage the release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: dist
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Fetch the staged artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: dist

      - name: Verify the staged checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check --strict SHA256SUMS

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # A prerelease suffix keeps the tag off the repository's latest
          # release, which is what /releases/latest resolves to.
          flags=()
          case "$GITHUB_REF_NAME" in
            *-*) flags+=(--prerelease) ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes \
            "${flags[@]}" \
            dist/*
