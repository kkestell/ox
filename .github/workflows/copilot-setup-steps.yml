# Copilot's cloud agent and code review run these steps before they start, so
# they can build, lint, and run `make test` and `make e2e`. The job must be
# named copilot-setup-steps. The push and pull_request triggers check the
# steps when this file changes.
name: Copilot setup steps

on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/copilot-setup-steps.yml]
  pull_request:
    paths: [.github/workflows/copilot-setup-steps.yml]

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: cmd/ox/web/package-lock.json
      # lint installs the web client's packages, builds it, downloads
      # golangci-lint, and fills the Go build cache.
      - run: make lint
