name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: cmd/ox/web/package-lock.json
      - uses: dprint/check@v2.6
      - run: make test
      - run: make e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: cmd/ox/web/test-results
