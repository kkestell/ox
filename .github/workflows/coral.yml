# Coral reviews each pull request: https://github.com/kkestell/coral
name: Coral

on:
  pull_request_target:
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: coral-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  coral:
    if: >-
      github.event_name != 'pull_request_target'
      || github.event.pull_request.head.repo.id == github.event.pull_request.base.repo.id
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: kkestell/coral/.github/workflows/coral.yml@main
    with:
      model: deepseek/deepseek-v4.1-flash-1017
      reasoning_effort: high
      instructions: >-
        Claude Code and OpenRouter are not available to you. Judge Claude Code's behavior
        from docs/harnesses/claude-code.md and the code.
    secrets:
      openrouter_management_key: ${{ secrets.OPENROUTER_MANAGEMENT_KEY }}
      coral_key_encryption_key: ${{ secrets.CORAL_KEY_ENCRYPTION_KEY }}
