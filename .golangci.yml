version: "2"

linters:
  default: none
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - exhaustive
    - gochecksumtype
    - govet
    - ineffassign
    - nilerr
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - thelper
    - unparam
    - unused
    - wastedassign
  settings:
    staticcheck:
      checks:
        # staticcheck's defaults, and error strings may start with "Claude".
        - all
        - -ST1000
        - -ST1003
        - -ST1005
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
